<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Us | Chronova</title>
    <link rel="icon" type="image/png" href="images/chronova-logo.png">
</head>
<body>
    
<header>

    <a href="index.html">
        <img src="images/chronova-logo.png" alt="Chronova logo">
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="feature1.html">Features</a>
        <a href="feature2.html">Technology</a>
        <a href="feature3.html">Design</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html">Log In</a>
        <a href="account.html">My Account</a>
    </nav>

</header>

<main>

    <section class="contact">

        <div class="contact-text">

            <h1>Contact Chronova</h1>

            <p>
                Have a question about Chronova? Fill out the form
                below and our team will get back to you.
            </p>

        </div>

        <div class="contact-form">

            <h2>Get in Touch</h2>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </section>

</main>

<footer>

    <p>&copy; 2026 Chronova. All rights reserved.</p>

</footer>

</body>
</html>
