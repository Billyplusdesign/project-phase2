<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Log In | Chronova</title>
    <link rel="icon" type="image/png" href="images/chronova-logo.png">
</head>

<body>

<header>

    <a href="index.html">
        <img src="images/chronova-logo.png" alt="Chronova logo">
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="feature1.html">Features</a>
        <a href="feature2.html">Technology</a>
        <a href="feature3.html">Design</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html">Log In</a>
        <a href="account.html">My Account</a>
    </nav>

</header>

<main>

    <section class="login">

        <div class="login-form">

            <img src="images/chronova-logo.png" alt="Chronova logo">

            <h1>Welcome Back</h1>

            <p>Log in to your Chronova account.</p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Log In</button>

                <p id="loginMessage"></p>

            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </section>

</main>

<footer>

    <p>&copy; 2026 Chronova. All rights reserved.</p>

</footer>

<script src="script.js"></script>

</body>
</html>
